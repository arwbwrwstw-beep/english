<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Journey</title>
<meta name="theme-color" content="#1f4fa3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* دفتر خط إنجليزي: ورق، حبر أزرق، سطر أحمر */
:root{--bg:#f3f6f8;--card:#fff;--fg:#17263a;--mut:#56677d;--line:#d5dee8;--ink:#1f4fa3;--on:#fff;--rule:#9bbbe0;--base:#d9534f;--ok:#17724a;--okbg:#e0f3e9;--bad:#b3352f;--badbg:#fbe7e5;--soft:#e6eefb;
--ar:"IBM Plex Sans Arabic","Noto Naskh Arabic",Tahoma,system-ui,sans-serif;--en:"Andika","Trebuchet MS",Verdana,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1723;--card:#182333;--fg:#e7eef7;--mut:#9fb0c6;--line:#2b3b52;--ink:#8ab4ff;--on:#0f1723;--rule:#38557d;--base:#e06c68;--ok:#6fd3a2;--okbg:#14372a;--bad:#ff9a93;--badbg:#40201f;--soft:#1f3150;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1723;--card:#182333;--fg:#e7eef7;--mut:#9fb0c6;--line:#2b3b52;--ink:#8ab4ff;--on:#0f1723;--rule:#38557d;--base:#e06c68;--ok:#6fd3a2;--okbg:#14372a;--bad:#ff9a93;--badbg:#40201f;--soft:#1f3150;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.8 var(--ar)}
#app{direction:rtl;text-align:right;max-width:42rem;margin:0 auto;padding-block:.75rem 5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;margin:.4rem 0;line-height:1.5}h2{font-size:1.15rem;margin:1.2rem 0 .5rem}h3{font-size:1rem;margin:0}
p{margin:.4rem 0}ul,ol{padding-inline-start:1.4rem}
.en,bdi{font-family:var(--en);unicode-bidi:isolate}
.en{direction:ltr;display:inline-block}
.mut{color:var(--mut);font-size:.9rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .9rem;min-height:2.75rem}
button:hover{border-color:var(--ink)}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.pri{background:var(--ink);color:var(--on);border-color:var(--ink);font-weight:600}
button.big{width:100%;font-size:1.3rem;padding:.9rem}
button.danger{color:var(--bad);border-color:var(--bad)}
input[type=text],textarea,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;max-width:100%}
textarea{width:100%;min-height:5rem}
.top{display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:2px solid var(--base);padding-bottom:.5rem;margin-bottom:.8rem}
.brand{font-family:var(--en);direction:ltr;font-weight:700;color:var(--ink)}
.sess{display:flex;gap:.4rem;align-items:center;font-variant-numeric:tabular-nums}
.sess button{min-height:2.2rem;padding:.2rem .6rem;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin:.6rem 0;min-width:0}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.4}
.bar{height:.6rem;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
/* السطور الأربعة */
.paper{direction:ltr;text-align:center;font-family:var(--en);font-size:5rem;line-height:8rem;height:8rem;white-space:nowrap;overflow:hidden;
background:linear-gradient(var(--rule),var(--rule)) 0 22%/100% 1px no-repeat,repeating-linear-gradient(90deg,var(--rule) 0 6px,transparent 6px 12px) 0 46%/100% 1px no-repeat,linear-gradient(var(--base),var(--base)) 0 73%/100% 2px no-repeat,linear-gradient(var(--rule),var(--rule)) 0 93%/100% 1px no-repeat}
.paper.word{font-size:3.2rem}
.sent{direction:ltr;text-align:left;font-family:var(--en);font-size:1.45rem;line-height:1.7}
.snd{min-width:2.75rem;padding:.3rem .6rem}
.ex{display:flex;gap:.7rem;align-items:center;border-top:1px solid var(--line);padding-top:.5rem;margin-top:.5rem}
.ex .pic{font-size:2.2rem}.ex>div{flex:1;min-width:0}
.opts{display:grid;gap:.5rem;margin-top:.8rem}
.opts button{font-size:1.15rem}
button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fb{border-radius:12px;padding:.8rem;margin-top:.8rem}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;direction:ltr;min-height:3rem;margin:.5rem 0}
.chips button{font-family:var(--en);font-size:1.2rem}
.slot{border-bottom:2px solid var(--base)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;direction:ltr}.pairs button{font-family:var(--en);font-size:1.5rem}
button.sel{background:var(--soft);border-color:var(--ink)}
canvas{width:100%;height:12rem;touch-action:none;border:1px dashed var(--line);border-radius:12px;display:block}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:.6rem;width:100%;text-align:right;margin:.35rem 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.4rem 1rem;margin:.5rem 0}
summary{cursor:pointer;padding:.5rem 0;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{border-bottom:1px solid var(--line);padding:.35rem;text-align:right}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;direction:rtl}
.modal>div{background:var(--card);border-radius:14px;padding:1.1rem;max-width:26rem;width:100%;max-height:90%;overflow:auto}
.warn{border-color:var(--base)}
label.set{display:flex;justify-content:space-between;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.6rem 0}

#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:30rem;margin:auto;background:var(--fg);color:var(--bg);padding:.7rem 1rem;border-radius:10px;z-index:30;direction:rtl;text-align:center}
</style>
</head>
<body>
<div id="app" lang="ar" dir="rtl"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
/* المنهج: المراحل 0-5. صيغة السطر: en|المعنى|النطق|مثال|ترجمة المثال */
const STAGES=[
{id:0,title:'التهيئة',sub:'كيف تتعلّم هنا'},
{id:1,title:'الحروف',sub:'Alphabet — ٢٦ حرفاً'},
{id:2,title:'أساسيات الأصوات',sub:'اسمع وميّز'},
{id:3,title:'قراءة الكلمات البسيطة',sub:'Phonics — دمج الأصوات'},
{id:4,title:'أنماط الحروف المتقدمة',sub:'حرفان بصوت واحد'},
{id:5,title:'المقاطع والكلمات الطويلة',sub:'Syllables'},
{id:6,title:'المفردات',sub:'كلمات حسب الموضوع'},
{id:7,title:'الكلمات غير المنتظمة والإملاء',sub:'Spelling'},
{id:8,title:'أساسيات القواعد',sub:'Grammar'},
{id:9,title:'بناء الجمل والتعبير',sub:'تكلّم بجمل قصيرة'},
{id:10,title:'القراءة والفهم',sub:'من الجملة إلى النص'},
{id:11,title:'الترجمة',sub:'المعنى قبل الكلمة'},
{id:12,title:'الإنجليزية العملية والمهنية',sub:'مسار اختياري'}
];
const LESSONS=[];
const rows=s=>s.trim().split('\n').map(l=>l.trim().split('|'));
function W(s){return rows(s).map(([en,ar,pr,ex,exar])=>({t:'w',en,ar,pr,ex,exar}))}
function SN(s){return rows(s).map(([en,ar,pr])=>({t:'s',en,ar,pr}))}
/* سؤال: النص|الصحيح|خطأ|خطأ|الشرح  — say: نص يُنطق قبل الإجابة */
function Q(s){return rows(s).map(a=>({q:a[0],a:a[1],o:a.slice(2,-1),why:a[a.length-1]}))}
function L(stage,id,title,intro,o){LESSONS.push(Object.assign({stage,id,title,intro,items:[],qs:[]},o||{}))}

/* ---------- 0 ---------- */
L(0,'start','طريقة التعلّم',
`<p>أهلاً بك. سنبدأ من الصفر ولا نفترض أنك تعرف أي حرف.</p>
<ol><li><b>تتعرّف</b> على شيء جديد قليل.</li><li><b>تسمع</b> نطقه بزر الصوت 🔊 وتكرّره بصوت عالٍ.</li><li><b>تتدرّب</b> وتُختبر. الخطأ عادي ويعود إليك لاحقاً.</li><li><b>تراجع</b> من زر «المراجعة» كل يوم.</li></ol>
<p>يُفتح الدرس التالي عندما تجيب 80٪ من الأسئلة بشكل صحيح من أول محاولة. تستطيع الإعادة كما تشاء دون أي عقوبة.</p>
<p>الإنجليزية تُكتب وتُقرأ <b>من اليسار إلى اليمين</b>، عكس العربية.</p>`,
{qs:Q(`
من أي جهة تُقرأ الإنجليزية؟|من اليسار إلى اليمين|من اليمين إلى اليسار|من الأعلى إلى الأسفل|الإنجليزية تبدأ من اليسار.
ماذا يحدث إذا أخطأت في سؤال؟|يعود إليّ للمراجعة لاحقاً|يُحذف تقدّمي|ينتهي التعلّم|الخطأ يضيف العنصر إلى المراجعة فقط.
ما الزر الذي تسمع به النطق؟|🔊|⏱️|⚙️|زر الصوت بجانب كل حرف وكلمة.`)});
L(0,'namesound','اسم الحرف وصوته',
`<p>لكل حرف إنجليزي شيئان مختلفان:</p>
<ul><li><b>الاسم</b>: ما تقوله عند تهجئة الحروف. مثل: <bdi>C</bdi> اسمه «سي».</li><li><b>الصوت</b>: ما تسمعه داخل الكلمة. في <bdi>cat</bdi> صوت <bdi>C</bdi> هو «ك».</li></ul>
<p>للقراءة نحتاج <b>الصوت</b>، وللتهجئة نحتاج <b>الاسم</b>. وبعض الحروف لها أكثر من صوت.</p>
<p>الحروف المتحركة (Vowels) خمسة: <bdi>A E I O U</bdi>. والباقي حروف ساكنة (Consonants). والحرف <bdi>Y</bdi> أحياناً يعمل عمل المتحرك.</p>
<p>أصوات ليست في العربية الفصحى نكتبها هكذا: <b>پ</b> (باء مهموسة)، <b>ڤ</b> (فاء مجهورة)، <b>گ</b> (جيم مصرية)، <b>چ</b> (تش). الكتابة العربية تقريب فقط، والمرجع هو الصوت.</p>`,
{items:W(`
cat|قطة|كَات
city|مدينة|سِتي
car|سيارة|كار`),qs:Q(`
ما اسم الحرف C؟|سي|ك|تش|الاسم «سي»، والصوت في cat هو «ك».
ما صوت الحرف C في كلمة cat؟|ك|سي|ج|هنا C يعطي صوت ك.
كم عدد الحروف المتحركة الأساسية؟|5|26|10|هي A E I O U.`)});

/* ---------- 1: الحروف ----------
 الحرف|اسمه إنجليزياً|اسمه بالعربية|أصواته|كلمة:نطق:معنى:صورة ×2|ملاحظة */
const LET={};
rows(`
A|ay|إيْ|«أَ» قصيرة مفتوحة مثل apple، أو «إيْ» مثل cake|apple:أَپِل:تفاحة:🍎|ant:أَنْت:نملة:🐜|اسمه «إيْ» لكن صوته في Apple «أَ».
B|bee|بي|«ب»|ball:بول:كرة:⚽|bag:بَاگ:حقيبة:👜|دائرة b الصغيرة على اليمين.
C|see|سي|«ك» غالباً، و«س» قبل e أو i أو y|cat:كَات:قطة:🐱|cup:كَپ:كوب:☕|في city يُنطق «س».
D|dee|دي|«د»|dog:دوگ:كلب:🐶|door:دور:باب:🚪|دائرة d الصغيرة على اليسار، عكس b.
E|ee|إي|«إِ» قصيرة مثل egg، أو «إي» طويلة مثل me|egg:إِگ:بيضة:🥚|elephant:إلِفَنْت:فيل:🐘|اسمه «إي» طويلة.
F|eff|إِف|«ف»|fish:فِش:سمكة:🐟|fan:فَان:مروحة:🪭|
G|jee|جي|«گ» غالباً، و«ج» أحياناً قبل e أو i|goat:گوت:ماعز:🐐|girl:گِيرل:بنت:👧|في giraffe يُنطق «ج».
H|aitch|إيتْش|«هـ»|hat:هَات:قبعة:🎩|house:هاوس:بيت:🏠|أحياناً لا يُنطق: hour.
I|eye|آيْ|«إِ» قصيرة مثل in، أو «آيْ» مثل bike|ink:إِنْك:حبر:🖋️|insect:إنْسِكت:حشرة:🐞|i الصغير له نقطة.
J|jay|جيْ|«ج» معطّشة|juice:جوس:عصير:🧃|jam:جَام:مربّى:🍓|
K|kay|كيْ|«ك»|key:كي:مفتاح:🔑|king:كِنْگ:ملك:🤴|لا يُنطق قبل n: knife.
L|el|إِل|«ل»|lion:لايَن:أسد:🦁|lemon:لِمَن:ليمون:🍋|l الصغير خط مستقيم.
M|em|إِم|«م»|moon:مون:قمر:🌙|milk:مِلْك:حليب:🥛|
N|en|إِن|«ن»|nose:نوز:أنف:👃|nest:نِسْت:عُش:🪺|n لها قوس واحد و m قوسان.
O|oh|أوْ|«أُ/آ» قصيرة مثل on، أو «أو» مثل home|orange:أورِنْج:برتقالة:🍊|octopus:أُكْتَپَس:أخطبوط:🐙|
P|pee|پي|«پ» شفتان مع دفعة هواء|pen:پِن:قلم:🖊️|pizza:پيتْسا:بيتزا:🍕|ليس «ب». ضع ورقة أمام فمك فتتحرك.
Q|cue|كيو|مع u غالباً: «كْو»|queen:كْوين:ملكة:👸|question:كْوِسْچَن:سؤال:❓|يأتي بعده u في الغالب.
R|ar|آر|«ر» خفيفة بلا تكرار|rabbit:رَابِت:أرنب:🐰|rain:رين:مطر:🌧️|لا يلمس اللسان سقف الفم.
S|ess|إِس|«س» وأحياناً «ز»|sun:سَن:شمس:☀️|star:سْتار:نجمة:⭐|في nose يُنطق «ز».
T|tee|تي|«ت»|tree:تْري:شجرة:🌳|tiger:تايگَر:نمر:🐯|
U|you|يو|«أَ» قصيرة مثل up، أو «يو» مثل cube|umbrella:أَمْبْرِلا:مظلة:☂️|up:أَپ:فوق:⬆️|
V|vee|ڤي|«ڤ» الأسنان على الشفة مع اهتزاز|van:ڤان:شاحنة صغيرة:🚐|violin:ڤايَلِن:كمان:🎻|ليس «ف».
W|double you|دَبْل يو|«و»|water:ووتَر:ماء:💧|window:وِنْدو:نافذة:🪟|
X|ex|إِكْس|«كْس» وغالباً في آخر الكلمة|box:بوكْس:صندوق:📦|six:سِكْس:ستة:6️⃣|
Y|why|واي|«ي»، وأحياناً حرف متحرك|yellow:يِلو:أصفر:🟡|yes:يِس:نعم:✅|في my يُنطق «آي».
Z|zee|زي|«ز»|zebra:زيبرا:حمار وحشي:🦓|zero:زيرو:صفر:0️⃣|البريطانيون يسمّونه «زِد» (zed).
`).forEach(([u,name,arn,snd,e1,e2,note])=>{
 const ex=[e1,e2].map(e=>{const[w,pr,ar,pic]=e.split(':');return{w,pr,ar,pic}});
 LET[u]={t:'l',en:u,low:u.toLowerCase(),name,arn,snd,ex,note};
});
[['abc','ABC'],['def','DEF'],['ghi','GHI'],['jkl','JKL'],['mno','MNO'],['pqr','PQR'],['stu','STU'],['vwx','VWX'],['yz','YZ']].forEach(([id,g])=>{
 L(1,'l-'+id,'الحروف '+g.split('').join(' '),
 `<p>تعلّم شكل كل حرف الكبير والصغير، واسمه، وصوته. اضغط 🔊 وكرّر بصوت عالٍ، ثم اكتبه بإصبعك على السطور.</p><p>الحرف الكبير يأتي في أول الجملة وأسماء الأشخاص والأماكن، والصغير في أغلب الكتابة.</p>`,
 {items:g.split('').map(c=>LET[c])});
});
L(1,'l-review','مراجعة الحروف كلها','<p>اختبار شامل على الأبجدية: الأشكال والأسماء والأوائل. أعده حتى يصير سهلاً.</p>',{items:Object.values(LET),reviewOnly:true,count:20,
qs:Q(`
أي حرف يأتي بعد D؟|E|F|B|الترتيب: A B C D E.
أي حرف يأتي قبل M؟|L|N|K|الترتيب: K L M N.
ما آخر حرف في الأبجدية؟|Z|Y|X|الأبجدية من A إلى Z.`)});

/* ---------- 2 ---------- */
L(2,'p-first','الصوت الأول','<p>اسمع الكلمة وركّز على <b>أول صوت</b> فيها، لا على معناها.</p><p>مثال: <bdi>sun</bdi> تبدأ بصوت «س» أي الحرف <bdi>s</bdi>.</p>',
{items:W(`
sun|شمس|سَن
map|خريطة|مَاپ
fan|مروحة|فَان
dog|كلب|دوگ`),qs:Q(`
[say:map] ما الصوت الأول؟|m|p|a|map تبدأ بـ m.
[say:fan] ما الصوت الأول؟|f|v|n|fan تبدأ بـ f.
[say:dog] ما الصوت الأول؟|d|b|g|dog تبدأ بـ d.
أي كلمة تبدأ بنفس صوت sun؟|sit|map|fan|sit و sun تبدآن بـ s.`)});
L(2,'p-pairs','أصوات ساكنة متشابهة','<p>أزواج تخدع المتعلم العربي:</p><ul><li><bdi>p / b</bdi>: p مع دفعة هواء، و b باهتزاز.</li><li><bdi>f / v</bdi>: نفس وضع الفم، و v باهتزاز.</li><li><bdi>s / z</bdi> و <bdi>t / d</bdi>: الثاني باهتزاز الحنجرة.</li></ul>',
{items:W(`
pin|دبوس|پِن
bin|سلة مهملات|بِن
fan|مروحة|فَان
van|شاحنة صغيرة|ڤان
sip|رشفة|سِپ
zip|سحّاب|زِپ
ten|عشرة|تِن
den|وكر|دِن`),qs:Q(`
[say:pin] أي كلمة سمعت؟|pin|bin|pen|pin تبدأ بـ p مع هواء.

 if(Array.isArray(o.tests))s.tests=o.tests.filter(isObj).slice(-200).map(x=>({at:num(x.at),name:String(x.name||'').slice(0,80),ok:num(x.ok),n:num(x.n)}));
 if(isObj(o.resume))for(const[k,v]of Object.entries(o.resume))if(lessonById(k)&&isObj(v))s.resume[k]={step:Math.max(0,num(v.step)|0)};
 if(lessonById(o.last))s.last=o.last;
 if(isObj(o.active))s.active={start:num(o.active.start),sec:num(o.active.sec),ok:num(o.active.ok),n:num(o.active.n),min:num(o.active.min),rang:!!o.active.rang};
 if(isObj(o.set)){const t=o.set,d=s.set;if(['auto','light','dark'].includes(t.theme))d.theme=t.theme;d.font=Math.min(140,Math.max(90,num(t.font,100)));if(['en-US','en-GB'].includes(t.accent))d.accent=t.accent;d.voice=String(t.voice||'');d.rate=Math.min(1.2,Math.max(.5,num(t.rate,.8)));d.per=[0,2,3,4].includes(t.per)?t.per:0;d.minutes=[0,5,10,15,20].includes(t.minutes)?t.minutes:0;d.translit=t.translit!==false;d.unlock=!!t.unlock}

const SKILL={look:'التعرّف على الشكل',listen:'الاستماع',meaning:'فهم المعنى',recall:'تذكّر الكلمة',spell:'الإملاء',order:'بناء الجمل',rule:'القواعد والفهم',translate:'الترجمة (تقييمك)'};

function record(key,ok,skill){
 const now=Date.now();let r=S.srs[key];
 if(!r)r=S.srs[key]={box:0,due:now,r:0,w:0,sk:{}};
 const sk=r.sk[skill]||(r.sk[skill]=[0,0]);
 if(ok){r.r++;sk[0]++;if(r.due<=now){r.box=Math.min(6,r.box+1);r.due=startDay(now)+GAP[r.box]*DAY}}
 else{r.w++;sk[1]++;r.box=0;r.due=now}
}
const startDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const dueKeys=()=>Object.keys(S.srs).filter(k=>S.srs[k].due<=Date.now()).sort((a,b)=>S.srs[a].box-S.srs[b].box||S.srs[b].w-S.srs[a].w||S.srs[a].due-S.srs[b].due);
/* متقن: صندوق 3 فأعلى ونجاح في مهارتين على الأقل */
const mastered=k=>{const r=S.srs[k];if(!r||r.box<3)return false;const n=Object.values(r.sk).filter(a=>a[0]>0).length;return n>=(ITEMS[k]?2:1)};
const weak=k=>{const r=S.srs[k];return r&&r.w>0&&r.box<2};

const LETTERSAY={A:'ay',B:'bee',C:'see',D:'dee',E:'ee',F:'eff',G:'jee',H:'aitch',I:'eye',J:'jay',K:'kay',L:'el',M:'em',N:'en',O:'oh',P:'pee',Q:'cue',R:'ar',S:'ess',T:'tee',U:'you',V:'vee',W:'double you',X:'ex',Y:'why',Z:'zee'};

const SAME=[['to','two','too'],['there','their'],['here','hear']];

const clash=(a,b)=>a!==b&&a.t!=='l'&&(a.ar===b.ar||SAME.some(g=>g.includes(a.en)&&g.includes(b.en)));
function others(item,field,n,pool){
 const val=item[field],seen=new Set([val]),out=[];
 for(const x of shuffle(pool).concat(shuffle(Object.values(ITEMS).filter(x=>x.t===item.t)))){if(x.t===item.t&&!clash(item,x)&&x[field]&&!seen.has(x[field])){seen.add(x[field]);out.push(x[field]);if(out.length===n)break}}
 return out}
const mc=(key,skill,html,a,wrong,why,extra)=>Object.assign({type:'mc',key,skill,html,a,opts:shuffle([a,...wrong]),why},extra);
function qFrom(q){const m=q.q.match(/^\[say:(\w+)\]\s*(.*)$/);return mc(q.key,m?'listen':'rule',`<h3 dir="auto">${esc(m?m[2]:q.q)}</h3>`,q.a,q.o,q.why,m?{say:m[1]}:{})}
function kinds(i,l){
 if(i.t==='l')return i.en==='X'?['case','listen','small']:['case','listen','first','small'];
 if(i.t==='s'){const k=['meaning','listen'];if(i.en.split(' ').length>2&&i.en.split(' ').length<10&&!i.en.includes(':'))k.push('order');if(l&&l.translate)return['translate','meaning','order'].filter(x=>x!=='order'||k.includes('order'));return k}
 const k=['meaning','listen','recall'];if(/^[a-z]{2,9}$/i.test(i.en))k.push('letters');if(i.exar)k.push('read');if(l&&l.spell)return['type','letters','meaning'].filter(x=>x!=='letters'||k.includes('letters'));if(l&&l.blend)return['listen','meaning','letters'];return k}
function qItem(i,kind,pool){
 const K=i.key,why=i.t==='l'?`${i.en} ${i.low} — اسمه «${i.arn}»`:`${i.en} = ${i.ar}`;

  if(kind==='small')return mc(K,'look',`<h3>ما الحرف الكبير المطابق؟</h3><div class="paper">${i.low}</div>`,i.en,others(i,'en',3,pool),why);
  if(kind==='listen')return mc(K,'listen','<h3>استمع واختر الحرف (اسمه)</h3>',i.en,others(i,'en',3,pool),why,{say:LETTERSAY[i.en]});
  const e=pick(i.ex);return mc(K,'look',`<h3>بأي حرف تبدأ هذه الكلمة؟</h3><p>${e.pic} ${esc(e.ar)}</p>`,i.low,others(i,'low',3,pool),`${e.w} تبدأ بالحرف ${i.low}`,{say:e.w})}
 if(kind==='listen')return mc(K,'listen','<h3>استمع واختر ما سمعت</h3>',i.en,others(i,'en',2,pool),why,{say:sayOf(i)});
 if(kind==='meaning')return mc(K,'meaning',`<h3>ما المعنى؟</h3><div class="sent">${esc(i.en)}</div>${sbtn(sayOf(i))}`,i.ar,others(i,'ar',3,pool),why);
 if(kind==='recall')return mc(K,'recall',`<h3>أي كلمة تعني «${esc(i.ar)}»؟</h3>`,i.en,others(i,'en',3,pool),why);
 if(kind==='read')return mc(K,'meaning',`<h3>اقرأ الجملة. ما معناها؟</h3><div class="sent">${esc(i.ex)}</div>${sbtn(i.ex)}`,i.exar,others(i,'exar',2,pool.filter(x=>x.exar)),`${i.ex} = ${i.exar}`);
 if(kind==='letters')return{type:'build',key:K,skill:'spell',html:`<h3>رتّب الحروف لتكتب: «${esc(i.ar)}»</h3>`,say:sayOf(i),parts:shuffle(i.en.split('')),a:i.en,sep:'',why};
 if(kind==='order'){const p=i.en.split(' ');let m=shuffle(p);if(m.join(' ')===i.en)m.reverse();return{type:'build',key:K,skill:'order',html:`<h3>رتّب الكلمات: «${esc(i.ar)}»</h3>`,parts:m,a:i.en,sep:' ',why}}
 if(kind==='type')return{type:'type',key:K,skill:'spell',html:`<h3>اكتب الكلمة التي تسمعها</h3><p class="mut">معناها: ${esc(i.ar)}</p>`,say:sayOf(i),a:i.en,why};
 return{type:'self',key:K,skill:'translate',html:`<h3>ترجم إلى العربية</h3><div class="sent">${esc(i.en)}</div>${sbtn(sayOf(i))}`,a:i.ar,why}}
function qForKey(k){if(QMAP[k])return qFrom(QMAP[k]);const i=ITEMS[k];if(!i)return null;const l=lessonById(i.lesson),ks=kinds(i,l),r=S.srs[k];
 /* نبدأ بالمهارة الأقل نجاحاً */
 const sc=x=>{const q=qItem(i,x,Object.values(ITEMS).filter(y=>y.lesson===i.lesson));const a=r&&r.sk[q.skill];return{q,s:(a?a[0]-a[1]:0)+Math.random()}};

function lessonQuiz(l){

 const stg={};keys.forEach(k=>{const x=(ITEMS[k]||QMAP[k]).stage;stg[x]=stg[x]||[0,0];stg[x][0]+=S.srs[k].r;stg[x][1]+=S.srs[k].w});
 const pct=v=>v[0]+v[1]<5?'<span class="mut">بيانات قليلة</span>':Math.round(v[0]/(v[0]+v[1])*100)+'٪';
 const chips=a=>a.length?a.map(k=>`<span class="en">${esc(ITEMS[k].en)}</span>`).join(' · '):'<span class="mut">لا شيء بعد</span>';
 const tbl=h=>`<div class="card tw"><table>${h}</table></div>`;
 return`${back()}<h1>تقدّمك</h1><div class="grid">${[['المستوى الحالي',n?n.stage:'✓'],['دروس اجتزتها',LESSONS.filter(l=>passed(l.id)&&!S.done[l.id].placed).length+'/'+LESSONS.length],['جلسات',S.sessions.length],['وقت التعلم',dur(S.time)],['حروف متقنة',letters.filter(mastered).length+'/26'],['كلمات متقنة',words.filter(mastered).length]].map(([a,b])=>`<div class="card stat"><b>${b}</b>${a}</div>`).join('')}</div>
 <p class="mut">«متقن» تعني: نجحت بالعنصر في مواعيد مراجعة متباعدة وبأكثر من نوع تمرين.</p>
 <h2>المراحل</h2><div class="card">${Object.values(S.done).some(d=>d.placed)?`<p class="mut">دروس تخطّيتها بالتقييم (لا تُعدّ إتقاناً): ${Object.values(S.done).filter(d=>d.placed).length}</p>`:""}<p>المكتملة: ${stDone.map(s=>s.id).join('، ')||'لا شيء بعد'}</p><p>المتبقية: ${STAGES.filter(s=>!stDone.includes(s)).map(s=>s.id).join('، ')}</p></div>
 <h2>المهارات</h2>${Object.keys(sk).length?tbl(Object.entries(sk).map(([k,v])=>`<tr><td>${SKILL[k]}</td><td>${pct(v)}</td><td class="mut">${v[0]+v[1]} إجابة</td></tr>`).join('')):'<p class="mut">لا توجد نتائج بعد.</p>'}
 ${Object.keys(stg).length?`<h2>الدقة حسب الموضوع</h2>${tbl(Object.entries(stg).map(([s,v])=>`<tr><td>${esc(STAGES[s].title)}</td><td>${pct(v)}</td></tr>`).join(''))}`:''}
 <h2>كلمات تعرفها</h2><div class="card">${chips(words.filter(mastered))}</div>
 <h2>تحتاج مراجعة</h2><div class="card">${chips(keys.filter(k=>ITEMS[k]&&weak(k)))}</div>
 <h2>سجل الجلسات</h2>${S.sessions.length?tbl(S.sessions.slice(-20).reverse().map(s=>`<tr><td>${new Date(s.at).toLocaleDateString('ar-IQ')}</td><td>${dur(s.sec)}</td><td>${s.ok}/${s.n}</td></tr>`).join('')):'<p class="mut">لا جلسات بعد.</p>'}`},
settings(){const t=S.set,sel=(id,opts,v)=>`<select id="${id}" data-set="${id}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
 return`${back()}<h1>الإعدادات</h1><div class="card"><h3>المظهر</h3>
 <label class="set">الوضع${sel('theme',[['auto','حسب الجهاز'],['light','فاتح'],['dark','داكن']],t.theme)}</label>
 <label class="set">حجم الخط${sel('font',[[90,'صغير'],[100,'عادي'],[115,'كبير'],[130,'أكبر']],t.font)}</label>
 <label class="set">النطق التقريبي بالعربية${sel('translit',[['1','ظاهر'],['0','مخفي']],t.translit?'1':'0')}</label></div>
 <div class="card"><h3>الدروس</h3><label class="set">كلمات في كل خطوة${sel('per',[[0,'3 (عادي)'],[2,'2'],[4,'4']],t.per)}</label>
 <label class="set">فتح كل الدروس (تخطّي الترتيب)${sel('unlock',[['0','لا'],['1','نعم']],t.unlock?'1':'0')}</label></div>
 <div class="card"><h3>الصوت</h3><label class="set">اللهجة${sel('accent',[['en-US','أمريكي'],['en-GB','بريطاني']],t.accent)}</label>
 <label class="set">الصوت${sel('voice',[['','تلقائي'],...voices.map(v=>[v.voiceURI,v.name+(v.localService?'':' (يحتاج إنترنت)')])],t.voice)}</label>
 <label class="set">السرعة${sel('rate',[[.6,'بطيء'],[.8,'متوسط'],[1,'عادي']],t.rate)}</label>
 <button data-a="say" data-t="Hello. This is an English voice.">🔊 جرّب الصوت</button>
 <p class="mut">${!TTS?'متصفحك لا يدعم النطق.':voices.length?'':'لم يظهر صوت إنجليزي بعد. اضغط «جرّب الصوت»، وإن لم تسمع شيئاً ثبّت صوتاً إنجليزياً من إعدادات الجهاز.'} النطق يأتي من جهازك ومتصفحك. عمله دون إنترنت يعتمد على الأصوات المثبتة. وأصوات الحروف المفردة لا ينطقها الجهاز بدقة، لذلك تسمعها داخل كلمات.</p></div>
 <div class="card"><h3>النسخ الاحتياطي</h3><p class="mut">تقدمك محفوظ في هذا المتصفح فقط. مسح بيانات المتصفح يمسحه، فصدّر نسخة بين فترة وأخرى.</p>
 <div class="row"><button class="pri" data-a="export">تصدير ملف JSON</button><button data-a="copy">نسخ النص</button></div><textarea id="bk" dir="ltr" hidden readonly aria-label="نص النسخة"></textarea>
 <h3>الاستيراد</h3><label class="set">من ملف<input type="file" id="file" accept=".json,application/json,text/plain"></label><textarea id="paste" dir="ltr" placeholder="أو الصق نص النسخة هنا" aria-label="لصق النسخة"></textarea><button data-a="import">استيراد النص الملصق</button></div>
 <div class="card"><h3>إعادة الضبط</h3><button class="danger" data-a="reset">مسح كل التقدم</button></div>`}
};
function rowK(k){const i=ITEMS[k],q=QMAP[k],r=S.srs[k];return`<tr><td>${i?`<span class="en">${esc(i.en)}</span>`:`<span dir="auto">${esc(q.q.replace(/\[say:\w+\]/,'استماع:'))}</span>`}</td><td>${i?esc(i.ar||i.arn):''}</td><td class="mut">أخطاء ${r.w}</td></tr>`}
function card(i,l){
 const tr=S.set.translit;
 if(i.t==='l')return`<div class="card"><div class="paper">${i.en} ${i.low}</div>
 <div class="row between"><div><h3>اسم الحرف: <span class="en">${esc(i.name)}</span>${tr?` «${i.arn}»`:''}</h3><div class="mut">الكبير ${i.en} · الصغير ${i.low}</div></div><button class="pri" data-a="say" data-t="${LETTERSAY[i.en]}">🔊 الاسم</button></div>
 <p><b>صوته:</b> ${esc(i.snd)}</p>${i.note?`<p class="mut">${esc(i.note)}</p>`:''}<p class="mut">اسمع الصوت في أول الكلمة (أو آخرها في X):</p>
 ${i.ex.map(e=>`<div class="ex"><span class="pic" aria-hidden="true">${e.pic}</span><div><span class="en">${e.w}</span> — ${e.ar}${tr?`<div class="mut">${e.pr}</div>`:''}</div>${sbtn(e.w)}</div>`).join('')}
 <h3>اكتبه بإصبعك</h3><canvas data-l="${i.en} ${i.low}" aria-label="لوحة كتابة الحرف"></canvas><button data-a="clear">امسح اللوحة</button></div>`;
 if(i.t==='s')return`<div class="card"><div class="sent">${esc(i.en)}</div><div class="row">${sbtn(sayOf(i))}<button data-a="slow" data-t="${esc(sayOf(i))}">🐢</button></div>${l.translate?`<details><summary>حاول أولاً، ثم اعرض الترجمة</summary><p>${esc(i.ar)}</p></details>`:`<p>${esc(i.ar)}</p>`}${tr&&i.pr?`<p class="mut">${esc(i.pr)}</p>`:''}</div>`;
 return`<div class="card"><div class="paper word">${esc(i.en)}</div><div class="row between"><div><h3>${esc(i.ar)}</h3>${tr?`<div class="mut">${esc(i.pr)}</div>`:''}</div><div class="row">${sbtn(i.en)}<button data-a="slow" data-t="${esc(i.en)}" aria-label="استمع ببطء">🐢</button></div></div>
 ${i.ex?`<div class="ex"><div><div class="sent">${esc(i.ex)}</div><div>${esc(i.exar)}</div></div>${sbtn(i.ex,'استمع للمثال')}</div>`:''}
 ${l.blend&&/^[a-z]{3,4}$/.test(i.en)?`<p class="mut">اقرأ الحروف بأصواتها من اليسار: <span class="en">${i.en.split('').join(' · ')}</span></p>`:''}</div>`}
function fb(q,an){const last=quiz.i===quiz.queue.length-1;
 return`<div class="fb ${an.ok?'ok':'no'}" role="status"><b>${an.ok?'صحيح ✓':'ليس صحيحاً ✗'}</b>${!an.ok&&q.a?`<div>الإجابة: ${tx(q.a)}</div>`:''}${q.why?`<div dir="auto">${esc(q.why)}</div>`:''}</div><button class="pri big" data-a="next">${last?'اعرض النتيجة':'التالي'}</button>`}
function initCanvas(){document.querySelectorAll('canvas').forEach(c=>{
 const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
 const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
 c._draw=()=>{x.clearRect(0,0,w,h);[[.15,'--rule'],[.4,'--rule'],[.72,'--base'],[.92,'--rule']].forEach(([y,v])=>{x.fillStyle=css(v);x.fillRect(0,h*y,w,y===.72?2:1)});
  x.globalAlpha=.22;x.fillStyle=css('--fg');x.textAlign='center';x.textBaseline='alphabetic';x.direction='ltr';x.font=`${h*.75}px Andika, Verdana, sans-serif`;x.fillText(c.dataset.l,w/2,h*.72,w-10);x.globalAlpha=1};
 c._draw();let down=false;
 const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);x.strokeStyle=css('--ink');x.lineWidth=7;x.lineCap=x.lineJoin='round';x.beginPath();const p=pos(e);x.moveTo(...p);x.lineTo(p[0]+.1,p[1]);x.stroke()};
 c.onpointermove=e=>{if(down){x.lineTo(...pos(e));x.stroke()}};c.onpointerup=c.onpointercancel=()=>down=false})}

/* ---------- النسخ الاحتياطي ---------- */
let dl=null;
if(window.claude?.use)window.claude.use('downloads').then(d=>dl=d).catch(()=>{});
const backupText=()=>JSON.stringify(Object.assign({},S,{active:null,exportedAt:Date.now()}));
async function exportFile(){
 const name=`english-journey-${new Date().toISOString().slice(0,10)}.json`,data=backupText();
 if(window.claude){if(!dl){showBackup();toast('تنزيل الملف غير متاح هنا. انسخ النص واحفظه.');return}
  try{await dl.save({filename:name,data});}catch(e){showBackup();toast('لم يُحفظ الملف. تستطيع نسخ النص بدلاً منه.')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function showBackup(){const t=$('#bk');if(!t)return;t.hidden=false;t.value=backupText();t.select()}
function importText(text){
 let raw,n;try{raw=JSON.parse(text);n=sanitize(raw)}catch(e){n=null}
 if(!n){modal('<h2>تعذّر الاستيراد</h2><p>هذا ليس ملف نسخة احتياطية صالحاً من هذا الموقع، أو أنه ناقص. لم يتغير تقدمك.</p>',[['حسناً',null,'pri']]);return}
 const sum=s=>`${Object.values(s.done).filter(d=>d.passed).length} درساً، ${s.sessions.length} جلسة، ${s.time/60|0} دقيقة`;
 const when=t=>t?new Date(t).toLocaleString('ar-IQ'):'—';
 const count=s=>Object.values(s.srs).reduce((a,r)=>a+r.r+r.w,0);
 const hasNow=count(S)||S.sessions.length||Object.keys(S.done).length;
 const older=hasNow&&(n.updatedAt<S.updatedAt&&(count(n)!==count(S)||sum(n)!==sum(S))||count(n)<count(S));
 modal(`<h2>${older?'⚠️ النسخة أقدم أو أقل من تقدمك الحالي':'استيراد النسخة'}</h2><p>الحالي: ${sum(S)}<br><span class="mut">${when(S.updatedAt)}</span></p><p>الملف: ${sum(n)}<br><span class="mut">${when(n.updatedAt)}</span></p><p>${older?'<b>الاستيراد سيمحو تقدماً أحدث.</b>':'سيحل الملف محل التقدم الحالي.'}</p>`,
 [[older?'استبدل رغم ذلك':'استورد',()=>{S=n;S.active=null;save();toast('تم الاستيراد');go('home')},older?'danger':'pri'],['إلغاء',null,older?'pri':'']])}

/* ---------- التقييم الأولي ---------- */
const PSTAGES=[1,3,6];
function placement(){
 const take=(st,n)=>shuffle(LESSONS.filter(l=>l.stage===st&&!l.reviewOnly).flatMap(l=>l.items)).slice(0,n);
 const qs=[];
 take(1,4).forEach((i,n)=>qs.push(Object.assign(qItem(i,kinds(i)[n%kinds(i).length],Object.values(LET)),{pstage:1})));
 take(3,4).forEach(i=>qs.push(Object.assign(qItem(i,'meaning',take(3,12)),{pstage:3})));
 take(6,4).forEach(i=>qs.push(Object.assign(qItem(i,'read',take(6,12)),{pstage:6})));
 quiz=null;startQuiz(qs,{name:'تحديد المستوى',placement:true});quiz.queue.sort((a,b)=>a.pstage-b.pstage);render();autoSay()}
function reviewQuiz(keys,name){const qs=keys.map(qForKey).filter(Boolean);if(!qs.length){toast('لا توجد عناصر للمراجعة بعد');return}ensureSession();startQuiz(shuffle(qs),{name});autoSay()}

/* ---------- الأحداث ---------- */
const ACT={
 go:d=>{if(TTS)speechSynthesis.cancel();go(d.v)},
 say:d=>speak(d.t),slow:d=>speak(d.t,true),stop:()=>TTS&&speechSynthesis.cancel(),
 start:()=>go('start'),
 min:d=>{S.set.minutes=+d.m;save();render()},
 begin:d=>{if(S.active){S.active.min=S.set.minutes?Math.ceil(S.active.sec/60)+S.set.minutes:0;S.active.rang=false}else ensureSession(S.set.minutes);save();d.to==='review'?ACT.rev():openLesson(d.to)},
 end:endSession,
 zero:()=>{S.onboarded=true;save();go('start')},
 placement,
 place:d=>{S.onboarded=true;LESSONS.filter(l=>l.stage<+d.s&&!passed(l.id)).forEach(l=>S.done[l.id]={best:0,passed:true,tries:0,at:Date.now(),placed:true});save();go('home')},
 lesson:d=>openLesson(d.id),
 relearn:d=>{S.resume[d.id]={step:0};openLesson(d.id)},
 step:d=>{const r=S.resume[view.id];r.step=Math.max(0,r.step+ +d.d);save();render();scrollTo(0,0)},
 quiz:d=>{const l=lessonById(d.id);ensureSession();startQuiz(lessonQuiz(l),{name:l.title,lesson:l.id});autoSay()},
 lrev:d=>reviewQuiz(shuffle(lessonById(d.id).items.map(i=>i.key)).slice(0,10),'مراجعة: '+lessonById(d.id).title),
 rev:()=>reviewQuiz(dueKeys().slice(0,15),'مراجعة'),
 free:()=>reviewQuiz(Object.keys(S.srs).sort((a,b)=>S.srs[a].box-S.srs[b].box||S.srs[b].w-S.srs[a].w).slice(0,10),'تدريب إضافي'),
 stest:d=>{const ls=LESSONS.filter(l=>l.stage===+d.s&&passed(l.id));const qs=[];ls.forEach(l=>{l.qs.forEach(q=>qs.push(qFrom(q)));l.items.forEach(i=>qs.push(qItem(i,pick(kinds(i,l)),l.items)))});ensureSession();startQuiz(shuffle(qs).slice(0,15),{name:'اختبار المرحلة '+d.s});autoSay()},
 opt:d=>{if(quiz.answered)return;const q=quiz.queue[quiz.i],v=q.opts[+d.n];answer(v===q.a,v)},
 build:d=>{quiz.built.push(+d.n);render()},unbuild:d=>{quiz.built.splice(+d.n,1);render()},
 check:()=>{const q=quiz.queue[quiz.i],v=quiz.built.map(n=>q.parts[n]).join(q.sep);answer(v===q.a,v)},
 giveup:()=>answer(false,''),
 show:()=>{const v=$('#mytr').value;quiz.shown=true;render();toast(v?'ترجمتك: '+v:'قارن مع النموذج')},
 self:d=>{quiz.shown=false;answer(d.ok==='1','')},
 reveal:()=>{$('#reveal').hidden=false},
 match:d=>{const q=quiz.queue[quiz.i],m=quiz.m;if(quiz.answered)return;
  if(d.s==='L'){m.sel=d.k;render();return}if(!m.sel){toast('اضغط الحرف الكبير أولاً');return}
  if(m.sel===d.k){m.done.push(d.k);record('l:'+d.k,!m.miss.has(d.k),'look');quizActivity(!m.miss.has(d.k))}else{m.miss.add(m.sel);toast('حاول مرة أخرى')}
  m.sel=null;
  if(m.done.length===q.items.length){const ok=!m.miss.size;quiz.answered={ok};if(!quiz.redo.has(q)){if(ok)quiz.first++;else quiz.wrong.push(q)}[...m.miss].forEach(k=>record('l:'+k,false,'look'));save()}
  render()},
 next:()=>{quiz.shown=false;nextQ()},
 clear:()=>document.querySelectorAll('canvas').forEach(c=>c._draw()),
 export:exportFile,
 copy:()=>{showBackup();navigator.clipboard?.writeText(backupText()).then(()=>toast('نُسخ النص. احفظه في ملف أو رسالة لنفسك.'),()=>toast('حدّد النص وانسخه يدوياً'))??toast('حدّد النص وانسخه يدوياً')},
 import:()=>importText($('#paste').value),
 reset:()=>modal('<h2>مسح كل التقدم؟</h2><p>ستُحذف الدروس والمراجعات والجلسات. لا يمكن التراجع. اكتب كلمة <b>مسح</b> للتأكيد.</p><input type="text" id="conf" aria-label="تأكيد">',[['نعم امسح',()=>{if($('#conf').value.trim()==='مسح'){const set=S.set;S=fresh();S.set=set;save();toast('تم المسح');go('home')}else toast('لم يُمسح شيء: كلمة التأكيد غير مطابقة')},'danger'],['إلغاء',null,'pri']])
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)ACT[b.dataset.a]?.(b.dataset)});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='typef'&&!quiz.answered){const v=$('#typed').value;if(!v.trim())return;answer(norm(v)===norm(quiz.queue[quiz.i].a),v)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.set){const k=t.dataset.set,v=t.value;S.set[k]=['font','rate','per'].includes(k)?+v:['translit','unlock'].includes(k)?v==='1':v;if(k==='accent')S.set.voice='';save();render()}
 if(t.id==='file'&&t.files[0]){const f=t.files[0];if(f.size>2e6){toast('الملف كبير جداً');return}f.text().then(importText).catch(()=>toast('تعذّرت قراءة الملف'));t.value=''}});
/* تغيّر التقدم في تبويب آخر */
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const s=sanitize(JSON.parse(e.newValue));if(s&&s.updatedAt>S.updatedAt){S=s;if(view.name!=='quiz')render()}}catch(_){}}});
S=load();render();
document.fonts?.ready.then(()=>document.querySelectorAll('canvas').forEach(c=>c._draw?.()));

if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
